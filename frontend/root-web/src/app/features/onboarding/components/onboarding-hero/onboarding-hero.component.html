<div class="hero">
  <div class="hero__blobs" aria-hidden="true">
    <span class="hero__blob hero__blob--a"></span>
    <span class="hero__blob hero__blob--b"></span>
    <span class="hero__blob hero__blob--c"></span>

    <span class="hero__particle hero__particle--1"><app-root-icon name="dumbbell" [size]="18" /></span>
    <span class="hero__particle hero__particle--2"><app-root-icon name="sparkles" [size]="14" /></span>
    <span class="hero__particle hero__particle--3"><app-root-icon name="activity" [size]="18" /></span>
  </div>

  <div class="hero__content">
    <div class="hero__brand">
      <app-root-icon name="dumbbell" [size]="20" />
      <span>ROOT</span>
    </div>

    <p class="hero__eyebrow">{{ content().eyebrow }}</p>
    <h1 class="hero__title">{{ content().title }}</h1>
    <p class="hero__text">{{ content().text }}</p>
  </div>
</div>
