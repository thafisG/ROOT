<div class="step">
  <h2 class="step__title">Tudo pronto, {{ name() }}</h2>
  <p class="step__subtitle">
    Confira suas escolhas antes de começar.
  </p>

  <dl class="summary">
    <div class="summary__row">
      <dt>Objetivo</dt>
      <dd>{{ goalLabel(goal()) }}</dd>
    </div>
    <div class="summary__row">
      <dt>Experiência</dt>
      <dd>{{ experienceLabel(experienceLevel()) }}</dd>
    </div>
    <div class="summary__row">
      <dt>Dias por semana</dt>
      <dd>{{ availableDaysPerWeek() }}</dd>
    </div>
  </dl>
</div>
